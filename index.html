<!doctype html>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no,email=no,address=no">
  <meta name="theme-color" content="#FBF7F1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>帮我砍一刀 · 就差你了</title>
  <meta name="description" content="仅剩 1 刀，帮我砍一下就好。">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/style.css">
  <script>document.documentElement.className = "js";</script>
</head>
<body>

  <!-- ============ 真的那封信 ============ -->
  <main class="page" id="page">
    <article class="paper" id="letter">
      <header class="mark">
        <h1 class="mark__text">骗到你啦</h1>
        <svg class="mark__stroke" viewBox="0 0 148 14" aria-hidden="true" focusable="false">
          <path d="M3 9.6C26 4.4 63 2.2 99 4.1c15 .8 31 2.5 45 5.6" />
        </svg>
      </header>

      <div class="msg" id="msg"></div>
      <p class="sign" id="sign"></p>

      <!-- 那只小老鼠：自己画的，不咬人 -->
      <div class="mouse" aria-hidden="true">
        <svg viewBox="0 0 120 80" focusable="false">
          <g class="mouse__tail">
            <path d="M27 59C10 61 2 51 6 42c2-5 7-6.5 11-4.5" />
          </g>
          <path class="mouse__body" d="M100 47c-3-6-8-10-14-12-12-4-30-4-42-1-14 3-24 10-24 19 0 8 10 12 26 12 16 0 34-2 42-6 7-3 11-7 12-12z" />
          <circle class="mouse__ear" cx="78" cy="28.5" r="8.2" />
          <circle class="mouse__earIn" cx="78" cy="27.6" r="3.6" />
          <circle class="mouse__eye" cx="89" cy="45" r="2.1" />
          <circle class="mouse__nose" cx="101" cy="47" r="2.4" />
          <path class="mouse__whisker" d="M100 50.5l8 3.2M100 46.8l8.5-.6" />
        </svg>
      </div>
    </article>
  </main>

  <!-- 万一浏览器关了 JS，还能看到信 -->
  <noscript>
    <div class="page">
      <article class="paper">
        <header class="mark"><h1 class="mark__text">骗到你啦</h1></header>
        <div class="msg">
          <p>骗到你啦，没有拼多多，这个链接是我偷偷准备的小惊喜。</p>
          <p>本来想让你帮我砍一刀，结果是我想借机跟你说几句话。</p>
          <p>跟你在一起真的很开心，一起吃饭、散步，或者聊些没营养的话，我都觉得挺好。</p>
          <p>有时候见完你回去，我还会想起当天的小事，然后自己偷偷乐一下。</p>
          <p>我是真的很喜欢你，也喜欢我们能一起分享日常、慢慢走进彼此生活的感觉。</p>
          <p>没什么大道理，就是想让你知道这些，顺便让你今天开心一点。</p>
          <p>至于助力奖励嘛，下次见面请你吃好吃的。</p>
        </div>
        <p class="sign">——夜行者</p>
      </article>
    </div>
  </noscript>

  <!-- ============ 先假装一下的“助力”页 ============ -->
  <section class="assist" id="assist" aria-hidden="true">
    <div class="assist__bar">
      <span class="assist__back">‹</span>
      <span class="assist__barTitle">好友助力</span>
      <span class="assist__dots">···</span>
    </div>

    <div class="assist__body">
      <div class="assist__col">
        <div class="assist__who">
          <span class="assist__ava"><b data-avatar>夜</b></span>
          <span class="assist__whoText"><b data-sender>夜行者</b> 邀请你帮忙砍一刀</span>
          <span class="assist__time">刚刚</span>
        </div>

        <div class="assist__item">
          <div class="assist__thumb">
            <svg viewBox="0 0 96 96" aria-hidden="true" focusable="false">
              <ellipse cx="48" cy="35" rx="19" ry="5.6" fill="#EFE4D2"/>
              <path d="M29 35v25a15 15 0 0 0 15 15h8a15 15 0 0 0 15-15V35" fill="#F6EEE1" stroke="#D8C7AE" stroke-width="1.4"/>
              <ellipse cx="48" cy="35" rx="19" ry="5.6" fill="#FBF5EA" stroke="#D8C7AE" stroke-width="1.4"/>
              <path d="M67 45c8.5.6 11 4.4 11 8.4 0 4-2.6 7.6-11 8.2" fill="none" stroke="#D8C7AE" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M40 22c-3-2.6 3-5.4 0-8M52 20c-3-2.6 3-5.4 0-8" fill="none" stroke="#E4D6C0" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="assist__info">
            <p class="assist__name">日式陶瓷马克杯 · 350ml</p>
            <p class="assist__sub">包邮 · 已售 2.3 万件</p>
            <p class="assist__price"><i>¥</i><b>0.01</b><s>¥39.00</s></p>
          </div>
        </div>

        <div class="assist__prog">
          <div class="assist__progRow">
            <span id="pct">已助力 98%</span>
            <span class="assist__gap" id="gapText">还差 1 刀</span>
          </div>
          <div class="assist__track"><i id="fill"></i></div>
          <p class="assist__helped">已有 3 位好友助力</p>
        </div>

        <button class="assist__btn" id="cutBtn" type="button">
          <span id="btnText">帮 TA 砍一刀</span>
        </button>
        <p class="assist__note">点击即助力 · 无需登录</p>

        <div class="assist__rules">
          <p class="assist__rulesTitle">助力须知</p>
          <p>1. 每位好友每天可助力一次，助力后立即生效。</p>
          <p>2. 助力金额自动抵扣，无需提现，24 小时内到账。</p>
          <p>3. 本活动仅限受邀好友参与。</p>
        </div>
      </div>
    </div>

    <div class="toast" id="toast">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8.4l3.1 3.1 6.5-6.6"/></svg>
      <span>助力成功</span>
    </div>
  </section>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
